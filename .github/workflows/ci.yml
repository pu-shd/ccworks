name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded PR runs are redundant; retain every main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here only reads the repo; nothing publishes, comments, or pushes.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        python -m venv .venv
        .venv/bin/pip install -r requirements-dev.lock -e .

    - name: Lint, format, and type-check Python
      run: |
        .venv/bin/ruff check src tests
        .venv/bin/ruff format --check tests/test_write_failures.py tests/test_extension.py tests/test_type_updates.py src/ccworks/safari_login.py tests/test_safari_login.py tests/test_session_handoff_browser.py tests/test_native_safari_handoff.py tests/test_allocation_resilience.py src/ccworks/bulk_allocations.py tests/test_bulk_allocations.py tests/test_bulk_allocation_cli.py src/ccworks/submission.py src/ccworks/operation_events.py src/ccworks/release_validation.py tests/test_submission_resilience.py tests/test_operation_events.py tests/test_release_validation.py tests/test_ui_readiness.py tests/test_skill.py tests/run_shard.py tests/test_ci_sharding.py
        .venv/bin/ruff format --check src/ccworks/browser_launch.py src/ccworks/desktop.py src/ccworks/desktop_window.py src/ccworks/paths.py src/ccworks/session_state.py src/ccworks/win_update.py src/ccworks/update_feed.py tests/test_github_updates.py tests/test_windows_update.py tests/test_desktop.py tests/test_desktop_bridge.py desktop
        .venv/bin/mypy
        .venv/bin/python -m ccworks.release_validation

    - name: Install zsh (the ccworks launcher is a zsh script)
      run: sudo apt-get install -y --no-install-recommends zsh

    - name: Run unit tests
      env:
        # The launcher forwarding tests invoke ./ccworks, which bootstraps a
        # .venv on first use. Skip its chromium download — this job is meant to
        # stay Playwright-free.
        CCWORKS_SKIP_BROWSER_BOOTSTRAP: "1"
      run: |
        # Only run the pure unit tests to avoid Playwright dependency issues
        .venv/bin/python -m unittest -v tests.test_client tests.test_launcher_dispatch tests.test_cli_surface tests.test_browser_bootstrap tests.test_write_failures tests.test_extension tests.test_safari_login tests.test_bulk_allocation_cli tests.test_operation_events tests.test_release_validation tests.test_skill tests.test_ci_sharding tests.test_desktop tests.test_desktop_bridge tests.test_windows_update tests.test_github_updates

  docker-test-shards:
    name: Docker shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - uses: actions/checkout@v4

    - name: Set up docker-compose compatibility symlink
      run: |
        if ! command -v docker-compose &> /dev/null; then
          sudo ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
        fi

    - name: Build the test container
      run: docker-compose build unit-tests

    - name: Container lint, types, and extension checks
      if: matrix.shard == 0
      run: |
        set -euo pipefail
        docker-compose build extension-tests
        docker-compose run --rm unit-tests ruff check src tests
        docker-compose run --rm unit-tests ruff format --check tests/test_write_failures.py tests/test_extension.py tests/test_type_updates.py src/ccworks/safari_login.py tests/test_safari_login.py tests/test_session_handoff_browser.py tests/test_native_safari_handoff.py tests/test_allocation_resilience.py src/ccworks/bulk_allocations.py tests/test_bulk_allocations.py tests/test_bulk_allocation_cli.py src/ccworks/submission.py src/ccworks/operation_events.py src/ccworks/release_validation.py tests/test_submission_resilience.py tests/test_operation_events.py tests/test_release_validation.py tests/test_ui_readiness.py tests/test_skill.py tests/run_shard.py tests/test_ci_sharding.py
        docker-compose run --rm unit-tests mypy
        docker-compose run --rm unit-tests python -m ccworks.release_validation
        docker-compose run --rm extension-tests

    - name: Run this partition of the complete suite
      env:
        TEST_SHARD: ${{ matrix.shard }}
      run: |
        set -euo pipefail
        docker-compose run --rm unit-tests python -m tests.run_shard --index "$TEST_SHARD" --count 4

  # Preserve the existing required-check name and fail on any incomplete shard.
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [docker-test-shards]
    if: ${{ always() }}
    steps:
    - name: Require every Docker shard
      env:
        SHARD_RESULT: ${{ needs.docker-test-shards.result }}
      run: |
        set -euo pipefail
        if [[ "$SHARD_RESULT" != success ]]; then
          echo "FAIL: Docker shards did not all succeed ($SHARD_RESULT)"
          exit 1
        fi
        echo "PASS: all four Docker shards completed successfully"

  browser-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        python -m venv .venv
        .venv/bin/pip install -r requirements.lock -e .

    - name: Install Playwright Chromium with OS Dependencies
      env:
        CCWORKS_SKIP_BROWSER_BOOTSTRAP: "1"
      run: |
        .venv/bin/python -m playwright install chromium --with-deps

    - name: Run Playwright browser smoke tests
      env:
        # Skip the runtime chromium bootstrap — we just installed it above.
        CCWORKS_SKIP_BROWSER_BOOTSTRAP: "1"
      run: |
        .venv/bin/python tests/test_browser_smoke.py
        .venv/bin/python tests/test_transaction_fields_crud.py
        .venv/bin/python tests/test_justification.py
        .venv/bin/python -m unittest -v tests.test_session_handoff_browser

  desktop-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [catalog, self-service]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: x64
    - name: Install the pinned Inno Setup compiler
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
        Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
        if ((Get-FileHash $download).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
          throw 'Inno Setup download hash did not match.'
        }
        $toolsDir = Join-Path $env:RUNNER_TEMP 'ccworks-inno'
        $setup = Start-Process $download -ArgumentList '/VERYSILENT', '/NORESTART', '/CURRENTUSER', "/DIR=`"$toolsDir`"" -Wait -PassThru
        if ($setup.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
        "CCWORKS_INNO_COMPILER=$(Join-Path $toolsDir 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Build and exercise the per-user Windows installer
      shell: pwsh
      env:
        CCWORKS_TEST_CHANNEL: ${{ matrix.channel }}
      run: |
        $selfService = $env:CCWORKS_TEST_CHANNEL -eq 'self-service'
        if ($selfService) {
          $env:CCWORKS_WINSPARKLE_FEED_URL = 'https://updates.example.test/windows-x64/appcast.xml'
          $publicKey = [Convert]::FromHexString('d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a')
          $env:CCWORKS_WINSPARKLE_PUBLIC_KEY = [Convert]::ToBase64String($publicKey)
        }
        & .\desktop\test-windows-signing.ps1
        & .\desktop\build-windows.ps1 -UnsignedInstaller
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & .\.venv\desktop\Scripts\python.exe -m unittest -v tests.test_desktop tests.test_windows_update
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & .\desktop\test-windows-installer.ps1 -ExpectWinSparkle:$selfService

  package-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build sdist + wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Verify the source archive includes the complete skill plugin
      run: |
        set -euo pipefail
        python - <<'PY_SKILL'
        from pathlib import Path
        import tarfile

        archives = list(Path("dist").glob("*.tar.gz"))
        assert len(archives) == 1, "Expected one source archive"
        expected = [Path(".agents/plugins/marketplace.json")]
        expected.extend(p for p in Path("plugins/ccworks").rglob("*") if p.is_file())
        assert len(expected) >= 5, "Skill bundle is missing"
        with tarfile.open(archives[0]) as archive:
            members = {m.name.split("/", 1)[1]: m for m in archive.getmembers() if "/" in m.name}
            for path in expected:
                member = members.get(path.as_posix())
                assert member and member.isfile(), f"Missing packaged resource: {path}"
                with archive.extractfile(member) as resource:
                    assert resource.read() == path.read_bytes(), f"Stale packaged resource: {path}"
        print(f"PASS: all {len(expected)} marketplace/skill resources match the source archive")
        PY_SKILL

    - name: Sanity-check installability from sdist
      run: |
        python -m venv /tmp/vv
        /tmp/vv/bin/pip install --upgrade pip
        /tmp/vv/bin/pip install dist/*.tar.gz
        # argparse-driven CLI: `ccworks` with no args exits non-zero and
        # prints its usage. We just need proof the entry point is wired.
        /tmp/vv/bin/ccworks 2>&1 | grep -qi "usage:" || { echo "ccworks entry point did not print usage"; exit 1; }
