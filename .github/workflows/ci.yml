name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every job here only reads the repo; nothing publishes, comments, or pushes.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        python -m venv .venv
        .venv/bin/pip install -r requirements-dev.lock -e .

    - name: Lint, format, and type-check Python
      run: |
        .venv/bin/ruff check src tests
        .venv/bin/ruff format --check tests/test_write_failures.py tests/test_extension.py tests/test_type_updates.py src/ccworks/safari_login.py tests/test_safari_login.py tests/test_session_handoff_browser.py tests/test_native_safari_handoff.py tests/test_allocation_resilience.py src/ccworks/bulk_allocations.py tests/test_bulk_allocations.py tests/test_bulk_allocation_cli.py src/ccworks/submission.py src/ccworks/operation_events.py src/ccworks/release_validation.py tests/test_submission_resilience.py tests/test_operation_events.py tests/test_release_validation.py tests/test_ui_readiness.py tests/test_skill.py
        .venv/bin/mypy
        .venv/bin/python -m ccworks.release_validation

    - name: Install zsh (the ccworks launcher is a zsh script)
      run: sudo apt-get install -y --no-install-recommends zsh

    - name: Run unit tests
      env:
        # The launcher forwarding tests invoke ./ccworks, which bootstraps a
        # .venv on first use. Skip its chromium download — this job is meant to
        # stay Playwright-free.
        CCWORKS_SKIP_BROWSER_BOOTSTRAP: "1"
      run: |
        # Only run the pure unit tests to avoid Playwright dependency issues
        .venv/bin/python -m unittest -v tests.test_client tests.test_launcher_dispatch tests.test_cli_surface tests.test_browser_bootstrap tests.test_write_failures tests.test_extension tests.test_safari_login tests.test_bulk_allocation_cli tests.test_operation_events tests.test_release_validation tests.test_skill

  docker-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up docker-compose compatibility symlink
      run: |
        if ! command -v docker-compose &> /dev/null; then
          sudo ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
        fi

    - name: Build and run tests via Docker Compose
      run: |
        docker-compose build unit-tests
        docker-compose build extension-tests
        docker-compose run --rm unit-tests ruff check src tests
        docker-compose run --rm unit-tests ruff format --check tests/test_write_failures.py tests/test_extension.py tests/test_type_updates.py src/ccworks/safari_login.py tests/test_safari_login.py tests/test_session_handoff_browser.py tests/test_native_safari_handoff.py tests/test_allocation_resilience.py src/ccworks/bulk_allocations.py tests/test_bulk_allocations.py tests/test_bulk_allocation_cli.py src/ccworks/submission.py src/ccworks/operation_events.py src/ccworks/release_validation.py tests/test_submission_resilience.py tests/test_operation_events.py tests/test_release_validation.py tests/test_ui_readiness.py tests/test_skill.py
        docker-compose run --rm unit-tests mypy
        docker-compose run --rm unit-tests python -m ccworks.release_validation
        docker-compose run --rm extension-tests
        docker-compose run --rm unit-tests

  browser-smoke-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        python -m venv .venv
        .venv/bin/pip install -r requirements.lock -e .

    - name: Install Playwright Chromium with OS Dependencies
      env:
        CCWORKS_SKIP_BROWSER_BOOTSTRAP: "1"
      run: |
        .venv/bin/python -m playwright install chromium --with-deps

    - name: Run Playwright browser smoke tests
      env:
        # Skip the runtime chromium bootstrap — we just installed it above.
        CCWORKS_SKIP_BROWSER_BOOTSTRAP: "1"
      run: |
        .venv/bin/python tests/test_browser_smoke.py
        .venv/bin/python tests/test_transaction_fields_crud.py
        .venv/bin/python tests/test_justification.py
        .venv/bin/python -m unittest -v tests.test_session_handoff_browser

  macos-reliability:
    runs-on: macos-26
    env:
      CCWORKS_SKIP_BROWSER_BOOTSTRAP: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the locked development environment
      run: |
        set -euo pipefail
        python -m venv .venv
        .venv/bin/pip install -r requirements-dev.lock -e .
        .venv/bin/python -m playwright install chromium
    - name: Exercise native control and recovery mocks on Apple Silicon
      run: |
        set -euo pipefail
        .venv/bin/python -m unittest -v tests.test_submission_resilience tests.test_submit_confirmation tests.test_ui_readiness tests.test_operation_events tests.test_release_validation tests.test_skill

  package-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build sdist + wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Verify the source archive includes the complete skill plugin
      run: |
        set -euo pipefail
        python - <<'PY_SKILL'
        from pathlib import Path
        import tarfile

        archives = list(Path("dist").glob("*.tar.gz"))
        assert len(archives) == 1, "Expected one source archive"
        expected = [Path(".agents/plugins/marketplace.json")]
        expected.extend(p for p in Path("plugins/ccworks").rglob("*") if p.is_file())
        assert len(expected) >= 5, "Skill bundle is missing"
        with tarfile.open(archives[0]) as archive:
            members = {m.name.split("/", 1)[1]: m for m in archive.getmembers() if "/" in m.name}
            for path in expected:
                member = members.get(path.as_posix())
                assert member and member.isfile(), f"Missing packaged resource: {path}"
                with archive.extractfile(member) as resource:
                    assert resource.read() == path.read_bytes(), f"Stale packaged resource: {path}"
        print(f"PASS: all {len(expected)} marketplace/skill resources match the source archive")
        PY_SKILL

    - name: Sanity-check installability from sdist
      run: |
        python -m venv /tmp/vv
        /tmp/vv/bin/pip install --upgrade pip
        /tmp/vv/bin/pip install dist/*.tar.gz
        # argparse-driven CLI: `ccworks` with no args exits non-zero and
        # prints its usage. We just need proof the entry point is wired.
        /tmp/vv/bin/ccworks 2>&1 | grep -qi "usage:" || { echo "ccworks entry point did not print usage"; exit 1; }
