name: Release validation

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  live-validation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require live validation and explicit release approval
        env:
          PYTHONPATH: src
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          flags=(--require-live --tag "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == v0.8.0 && -f release/macos-v0.8.0-exception.json ]]; then
            .venv/bin/python -m unittest -v tests.test_release_validation
            flags+=(--allow-macos-v080-exception)
          fi
          .venv/bin/python -m ccworks.release_validation "${flags[@]}"
