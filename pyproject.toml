[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccworks"
version = "0.7.1"
description = "SAP Concur browser-automation and API helper"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Michael Bino" },
]
keywords = ["concur", "sap-concur", "expense-report", "browser-automation", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "playwright>=1.44.0",
]

[project.scripts]
ccworks = "ccworks.cli:main"

[project.urls]
Homepage = "https://github.com/pu-shd/ccworks"
Source = "https://github.com/pu-shd/ccworks"
Issues = "https://github.com/pu-shd/ccworks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ccworks"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/release",
    "/plugins/ccworks",
    "/.agents/plugins/marketplace.json",
    "/docs/live-validation-2026-12-01.md",
    "/README.md",
    "/LICENSE.md",
    "/pyproject.toml",
    "/.env.example",
    "/requirements.lock",
    "/requirements-dev.lock",
    "/.pi/extensions/concur.ts",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Catch syntax errors, invalid control flow, and undefined names throughout the
# existing code without combining the bug fixes with a repository-wide restyle.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["src/ccworks"]
